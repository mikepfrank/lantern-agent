[Unit]
Description=Lantern administrator browser room
ConditionPathExists=/etc/lantern/admin-web.env

[Service]
EnvironmentFile=/etc/lantern/admin-web.env
ExecStart=
ExecStart=/usr/local/bin/lantern admin-web --public-origin ${LANTERN_PUBLIC_ORIGIN} --port 8766
InaccessiblePaths=-/home/lantern/.local/state/lantern/web-key
