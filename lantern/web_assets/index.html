<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Lantern · Conversation</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/room.css">
  <script src="/markdown-it-15.0.3.min.js" defer></script>
  <script src="/message-format.js" defer></script>
  <script src="/room.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="lamp" aria-hidden="true"></span>Lantern</div>
      <span class="connection" id="connection" role="status"><i aria-hidden="true"></i><span>Connecting</span></span>
    </div>
  </header>
  <main>
    <div class="room-heading">
      <h1>Conversation</h1>
      <button id="review-inbox" type="button" aria-haspopup="dialog" hidden>Answer Opus</button>
      <span class="worker" id="worker" aria-live="polite"></span>
    </div>
    <p id="review-notice" role="status"></p>
    <dialog id="review-dialog" aria-labelledby="review-title" aria-describedby="review-about">
      <form id="review-form">
        <h2 id="review-title">Opus needs clarification</h2>
        <p id="review-about"></p>
        <div class="review-details">
          <div class="review-meta"><span id="review-number"></span><time id="review-time"></time></div>
          <strong>Action under review</strong>
          <code id="review-action"></code>
          <div id="review-evidence" hidden>
            <strong>Supporting excerpt</strong>
            <blockquote id="review-excerpt"></blockquote>
          </div>
          <p id="review-question"></p>
        </div>
        <label for="review-answer">Your answer to Opus</label>
        <textarea id="review-answer" rows="3" maxlength="2000" required autofocus></textarea>
        <p id="review-error" role="alert"></p>
        <div class="review-buttons">
          <button id="review-next" type="button" hidden>Next question</button>
          <button id="review-later" type="button">Later</button>
          <button id="review-submit" type="submit" disabled>Send answer</button>
        </div>
      </form>
    </dialog>
    <section class="history" aria-label="Conversation history" tabindex="0" id="history">
      <button class="older" id="older" type="button" hidden>Load earlier messages</button>
      <div class="empty" id="empty">Loading conversation…</div>
      <div id="events"></div>
    </section>
    <div class="jump-wrap"><button id="jump" type="button" hidden>Latest messages ↓</button></div>
    <form id="composer">
      <label for="draft">Message Lantern</label>
      <textarea id="draft" rows="2" maxlength="16000" placeholder="Write a message…" disabled></textarea>
      <div class="send-row">
        <span id="send-state" role="status"></span>
        <button id="send" type="submit" disabled>Send <span aria-hidden="true">↑</span></button>
      </div>
    </form>
    <p class="sr-only" role="status" id="announcer"></p>
    <noscript>Enable JavaScript to open the operator conversation.</noscript>
  </main>
</body>
</html>
